services:
  - type: web
    name: dikidi-alice-skill
    env: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DIKIDI_BACKEND
        value: sdk
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CREDENTIALS_ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dikidi-connections
          property: connectionString

# Free expires after 30 days. Select a paid database explicitly for long-term use.
databases:
  - name: dikidi-connections
    plan: free
    region: frankfurt
    databaseName: dikidi
    user: dikidi
